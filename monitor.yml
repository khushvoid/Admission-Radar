name: admission-radar-monitor
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check official admission sources
        run: python monitor.py
      - name: Commit updated snapshot
        run: |
          git config user.name "admission-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/colleges.json
          git diff --cached --quiet || git commit -m "Update admission source checks"
          git push
